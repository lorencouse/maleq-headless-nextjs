<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Male Q</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #ffffff;
      color: #0a0a0a;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0a0a0a; color: #fafafa; }
      .btn-primary { background: #fafafa; color: #0a0a0a; }
      .btn-secondary { border-color: #333; color: #fafafa; }
      .btn-secondary:hover { background: #1a1a1a; }
      .divider { border-color: #333; }
    }
    .container { text-align: center; max-width: 32rem; width: 100%; }
    .icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
    h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 0.75rem; }
    .description { font-size: 1.125rem; color: #666; margin-bottom: 2rem; line-height: 1.6; }
    .buttons { display: flex; flex-direction: column; gap: 1rem; justify-content: center; margin-bottom: 2rem; }
    @media (min-width: 640px) { .buttons { flex-direction: row; } }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600;
      border-radius: 0.5rem; text-decoration: none; transition: all 0.2s;
      cursor: pointer; border: none;
    }
    .btn-primary { background: #0a0a0a; color: #ffffff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid #e5e5e5; color: #0a0a0a; }
    .btn-secondary:hover { background: #f5f5f5; }
    .divider { border-top: 1px solid #e5e5e5; padding-top: 1.5rem; }
    .hint { font-size: 0.875rem; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">Having trouble loading this page</h1>
    <p class="description" id="description">
      The page is taking longer than usual to respond. We'll retry automatically — or you can try again now.
    </p>
    <div class="buttons">
      <button class="btn btn-primary" onclick="window.location.reload()">
        ↻ Try Again
      </button>
      <a href="/" class="btn btn-secondary">
        Go Home
      </a>
    </div>
    <div class="divider">
      <p class="hint" id="hint">Retrying shortly…</p>
    </div>
  </div>
  <script>
    // This page is served by the service worker when a navigation fails OR the
    // server is too slow to respond. Distinguish the two cases so we don't tell
    // an ONLINE user they're "offline" (the server was just slow/down).
    (function () {
      var icon = document.getElementById('icon');
      var title = document.getElementById('title');
      var description = document.getElementById('description');
      var hint = document.getElementById('hint');

      function render() {
        if (navigator.onLine === false) {
          icon.textContent = '📡';
          title.textContent = "You're offline";
          description.textContent =
            "It looks like you've lost your internet connection. We'll reload this page automatically once you're back online.";
          hint.textContent = 'Waiting for your connection to return…';
        } else {
          icon.textContent = '⏳';
          title.textContent = 'Having trouble loading this page';
          description.textContent =
            "The page is taking longer than usual to respond. We'll retry automatically — or you can try again now.";
          hint.textContent = 'Retrying shortly…';
        }
      }

      render();

      // Reload the instant the connection comes back.
      window.addEventListener('online', function () { window.location.reload(); });
      window.addEventListener('offline', render);

      // When the user is online but the server was slow/down, auto-retry on a
      // backoff so the real page loads as soon as the server recovers — without
      // hammering it. 5s, then 10s, then every 20s.
      var delays = [5000, 10000, 20000];
      var attempt = 0;
      function scheduleRetry() {
        var delay = delays[Math.min(attempt, delays.length - 1)];
        attempt++;
        setTimeout(function () {
          if (navigator.onLine !== false) {
            window.location.reload();
          } else {
            scheduleRetry();
          }
        }, delay);
      }
      scheduleRetry();
    })();
  </script>
</body>
</html>
