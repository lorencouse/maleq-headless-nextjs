name: Unit tests

on:
  push:
    branches: [main, initial-setup]
  pull_request:
    branches: [main, initial-setup]
  workflow_dispatch:

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Includes __tests__/lib/restricted-products.test.ts (the Stripe gate) and the
      # PHP-parity test for the WordPress guard — ubuntu-latest ships a php binary.
      - name: Run unit tests
        run: bun run test -- --ci

      - name: Restricted-rules JSON for the WordPress guard is current
        run: bun scripts/gen-restricted-rules.ts --check
