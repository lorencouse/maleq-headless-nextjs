name: UAT Smoke E2E

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  uat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_WEBSERVER: '1'
      PLAYWRIGHT_TEST_BASE_URL: 'https://maleq.com'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.45'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run smoke tests (Chromium + WebKit)
        run: bunx playwright test e2e/home.spec.ts e2e/shop.spec.ts e2e/cart.spec.ts --project=chromium --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
