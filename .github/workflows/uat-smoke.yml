name: UAT Smoke E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

jobs:
  uat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_WEBSERVER: '1'
      PLAYWRIGHT_TEST_BASE_URL: 'https://maleq.com'
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run smoke tests (Chromium + WebKit)
        run: npx playwright test e2e/home.spec.ts e2e/shop.spec.ts e2e/cart.spec.ts --project=chromium --project=webkit

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
